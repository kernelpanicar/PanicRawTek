name: Build macOS (VST3 + AU)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j4 --target PanicRawTek_VST3 PanicRawTek_AU

      - name: Sign (ad-hoc) and package
        run: |
          ART="build/PanicRawTek_artefacts/Release"
          mkdir -p dist
          cp -R "$ART/VST3/Panic Raw Tek.vst3" dist/
          cp -R "$ART/AU/Panic Raw Tek.component" dist/
          codesign --force --deep --sign - "dist/Panic Raw Tek.vst3"
          codesign --force --deep --sign - "dist/Panic Raw Tek.component"
          cat > dist/instalar.command <<'SH'
          #!/bin/bash
          cd "$(dirname "$0")"
          V="$HOME/Library/Audio/Plug-Ins/VST3"; A="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$V" "$A"
          rm -rf "$V/Panic Raw Tek.vst3" "$A/Panic Raw Tek.component"
          cp -R "Panic Raw Tek.vst3" "$V/" && cp -R "Panic Raw Tek.component" "$A/"
          xattr -cr "$V/Panic Raw Tek.vst3" "$A/Panic Raw Tek.component"
          codesign --force --deep --sign - "$V/Panic Raw Tek.vst3" "$A/Panic Raw Tek.component"
          killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
          echo "✅ Panic Raw Tek instalado. En Ableton: Option + click en Rescan."
          SH
          sed -i '' 's/^          //' dist/instalar.command
          chmod +x dist/instalar.command
          cd dist && ditto -c -k --keepParent . ../PanicRawTek-mac-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PanicRawTek-mac-universal
          path: PanicRawTek-mac-universal.zip
